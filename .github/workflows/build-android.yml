name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configureaza Android SDK
        uses: android-actions/setup-android@v3

      - name: Accepta licentele SDK
        run: yes | sdkmanager --licenses || true

      - name: Instaleaza platforma si build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Scrie local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > android-app/local.properties

      - name: Instaleaza Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Incarca APK
        uses: actions/upload-artifact@v4
        with:
          name: VolumeRemote-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
